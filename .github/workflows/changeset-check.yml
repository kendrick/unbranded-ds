name: Changeset check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Verify changeset present for package changes
    runs-on: ubuntu-latest
    # Skip the Changesets release PR. It deletes the .changeset/*.md files by design
    # when it versions packages, so the "needs a changeset" gate below would always
    # misfire on it. Every real contributor PR is still gated.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect package changes
        id: detect
        # A changeset is only required when a PR changes something that ships. Test
        # files and the vitest config live under packages/ but never land in the
        # published dist, so editing them can't affect consumers. Filter them out
        # before deciding, so a test-only PR isn't forced into a version bump.
        run: |
          PUBLISHABLE=$(git diff --name-only origin/main...HEAD \
            | grep -E '^packages/(tokens|react)/' \
            | grep -vE '\.test\.[jt]sx?$' \
            | grep -vE '(^|/)vitest\.[^/]+$' \
            || true)
          if [ -n "$PUBLISHABLE" ]; then
            echo "package_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changeset present
        if: steps.detect.outputs.package_changed == 'true'
        run: |
          pnpm changeset status --since=origin/main --output=/tmp/status.json
          NEW=$(jq '.changesets | length' /tmp/status.json)
          if [ "$NEW" -eq 0 ]; then
            echo "::error::PR touches packages/ but no .changeset/*.md file is present. Run 'pnpm changeset' from the repo root, pick the affected packages and bump levels, and commit the resulting file. See .changeset/README.md for the contributor workflow."
            exit 1
          fi
          echo "✓ Found $NEW changeset(s) for this PR"
