name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a PR's in-flight run when a newer commit lands (free-tier queue saver).
# Scoped to PRs: a push to main is never cancelled, so a Chromatic/MCP deploy finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, decide whether the change is docs-only so the heavy jobs
  # (Storybook a11y, example e2e, Chromatic) can skip. Fail-safe: a PR counts as
  # docs-only only if EVERY changed file is docs/markdown/changeset/LICENSE; any
  # other path runs the full gate. Push events ignore this (the heavy jobs' `if`
  # forces them on for main).
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        run: |
          NONDOC=$(git diff --name-only origin/main...HEAD | grep -vE '^(docs/|specs/|\.changeset/|.*\.md$|LICENSE$)' || true)
          if [ -z "$NONDOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change; the Storybook, example-e2e, and Chromatic jobs will be skipped."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            { echo "Non-docs paths changed; running the full gate:"; echo "$NONDOC"; }
          fi

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint runs before typecheck per the constitution's install → lint → typecheck
      # job graph (Section VIII). errors-only is ESLint's default — the React-19 idiom
      # warnings are intentionally non-blocking.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate sidecar code blocks
        run: pnpm exec tsx scripts/validate-sidecars.ts

      - name: Build all packages
        run: pnpm build

      - name: Unit tests
        # Runs after `pnpm build` so the token-query MCP smoke test can spawn
        # the built binary at `packages/tokens/dist/ts/mcp/server.js`.
        run: pnpm test:unit

      - name: Build Storybook
        run: pnpm --filter @unbranded-ds/storybook build

  publish:
    name: Chromatic publish + MCP smoke test
    needs: [verify, changes]
    runs-on: ubuntu-latest
    # Always on a push to main (the deploy). On a PR, only when same-repo (forks lack
    # the secret) AND not docs-only.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.docs_only != 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter '@unbranded-ds/*' --filter '!@unbranded-ds/example-nextjs' build

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          exitZeroOnChanges: true

      - name: MCP smoke test
        run: pnpm dlx tsx scripts/mcp-smoke-test.ts ${{ steps.chromatic.outputs.storybookUrl }}/mcp

  example-e2e:
    name: Example app (lint, typecheck, Playwright)
    needs: [verify, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The example imports the packages' built dist, so build them first.
      - name: Build packages
        run: pnpm --filter @unbranded-ds/tokens --filter @unbranded-ds/react build

      - name: Lint + typecheck the example
        run: |
          pnpm --filter @unbranded-ds/example-nextjs lint
          pnpm --filter @unbranded-ds/example-nextjs typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The ubuntu-24.04 image already ships Chromium's system libraries (Chrome is
      # preinstalled), so we skip --with-deps and the flaky apt round-trip it triggers.
      # On a cache hit the browser binary is already restored, so the install is a
      # no-op we skip. timeout-minutes caps a stalled download so it can't ride the
      # 6-hour job default.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @unbranded-ds/example-nextjs exec playwright install chromium

      # The Playwright webServer runs `next build` then `next start` itself.
      - name: Playwright e2e (production build)
        run: pnpm --filter @unbranded-ds/example-nextjs e2e

  storybook-test:
    name: Storybook test-runner (interaction + a11y)
    needs: [verify, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The stories import the packages' built dist (theme CSS + components),
      # so build them before the gate runs.
      - name: Build packages
        run: pnpm --filter @unbranded-ds/tokens --filter @unbranded-ds/react build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The ubuntu-24.04 image already ships Chromium's system libraries (Chrome is
      # preinstalled), so we skip --with-deps and the flaky apt round-trip it triggers.
      # On a cache hit the browser binary is already restored, so the install is a
      # no-op we skip. timeout-minutes caps a stalled download so it can't ride the
      # 6-hour job default.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @unbranded-ds/storybook exec playwright install chromium

      - name: Storybook test-runner (interaction + a11y)
        run: pnpm --filter @unbranded-ds/storybook test:storybook
