name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate sidecar code blocks
        run: pnpm exec tsx scripts/validate-sidecars.ts

      - name: Build all packages
        run: pnpm build

      - name: Unit tests
        # Runs after `pnpm build` so the token-query MCP smoke test can spawn
        # the built binary at `packages/tokens/dist/ts/mcp/server.js`.
        run: pnpm test:unit

      - name: Build Storybook
        run: pnpm --filter @unbranded-ds/storybook build

  publish:
    name: Chromatic publish + MCP smoke test
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter '@unbranded-ds/*' --filter '!@unbranded-ds/example-nextjs' build

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          exitZeroOnChanges: true

      - name: MCP smoke test
        run: pnpm dlx tsx scripts/mcp-smoke-test.ts ${{ steps.chromatic.outputs.storybookUrl }}/mcp

  example-e2e:
    name: Example app (lint, typecheck, Playwright)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The example imports the packages' built dist, so build them first.
      - name: Build packages
        run: pnpm --filter @unbranded-ds/tokens --filter @unbranded-ds/react build

      - name: Lint + typecheck the example
        run: |
          pnpm --filter @unbranded-ds/example-nextjs lint
          pnpm --filter @unbranded-ds/example-nextjs typecheck

      - name: Install Playwright browser
        run: pnpm --filter @unbranded-ds/example-nextjs exec playwright install --with-deps chromium

      # The Playwright webServer runs `next build` then `next start` itself.
      - name: Playwright e2e (production build)
        run: pnpm --filter @unbranded-ds/example-nextjs e2e
